  <div id="root" data-composition-id="reveal" data-width="1920" data-height="1080">
    <div id="rv-stage" data-layout-allow-overflow>
      <div id="rv-radar">
        <div class="rv-ring" id="rv-r1" style="left:850px;top:430px;width:220px;height:220px"></div>
        <div class="rv-ring" id="rv-r2" style="left:740px;top:320px;width:440px;height:440px"></div>
        <div class="rv-ring" id="rv-r3" style="left:630px;top:210px;width:660px;height:660px"></div>
        <div class="rv-ring" id="rv-r4" style="left:520px;top:100px;width:880px;height:880px"></div>
        <div id="rv-sweep"><i></i></div>
        <div id="rv-blips"></div>
        <div id="rv-dot"></div>
      </div>
      <div id="rv-word"><span>R</span><span>a</span><span>d</span><span>a</span><span>r</span></div>
      <div id="rv-sub">The best AI tools on the radar.</div>
    </div>
  </div>
  <script>
    (function () {
      const blips = [
        ["logo-opusclip", 42, 330], ["dir-logo-2", 98, 220], ["logo-vizard", 150, 420],
        ["dir-logo-1", 214, 330], ["dir-logo-5", 268, 200], ["logo-ytshorts", 318, 420], ["dir-logo-10", 18, 200]
      ];
      const holder = document.getElementById("rv-blips");
      blips.forEach((b, i) => {
        const d = document.createElement("div");
        d.className = "rv-blip";
        d.id = "rv-b" + i;
        const a = (b[1] * Math.PI) / 180;
        d.style.left = 960 + b[2] * Math.sin(a) + "px";
        d.style.top = 540 - b[2] * Math.cos(a) + "px";
        d.innerHTML = '<img src="assets/ui/' + b[0] + '.png" alt="">';
        holder.appendChild(d);
      });

      const tl = gsap.timeline({ paused: true });
      // Dot (from the collapsed browser) pulses once, rings unfold out of it.
      tl.fromTo("#rv-dot", { scale: 1 }, { scale: 1.6, duration: 0.12, ease: "power2.out" }, 0);
      tl.to("#rv-dot", { scale: 1, duration: 0.3, ease: "power3.out" }, 0.12);
      ["#rv-r1", "#rv-r2", "#rv-r3", "#rv-r4"].forEach((r, i) => {
        tl.fromTo(r, { scale: 0.05, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.08 + i * 0.07);
      });
      // The sweep turns at a constant 225 deg/s; each tool lights up as the beam passes it.
      const T0 = 0.3, DPS = 225;
      tl.fromTo("#rv-sweep", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, T0);
      tl.fromTo("#rv-sweep", { rotation: 0 }, { rotation: DPS * 4.1, duration: 4.1, ease: "none" }, T0);
      blips.forEach((b, i) => {
        const at = T0 + b[1] / DPS;
        tl.fromTo("#rv-b" + i, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, at);
      });

      // Radar slides left and shrinks; the name lands letter by letter.
      tl.to("#rv-radar", { x: -380, scale: 0.6, duration: 0.7, ease: "power3.inOut" }, 1.75);
      tl.fromTo("#rv-word span", { opacity: 0, filter: "blur(12px)", y: 0 },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out", stagger: 0.07 }, 2.15);
      tl.fromTo("#rv-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 2.6);

      // Zoom through.
      tl.to("#rv-stage", { scale: 2.4, opacity: 0, filter: "blur(14px)", duration: 0.38, ease: "power3.in" }, 4.02);

      window.__timelines["reveal"] = tl;
    })();
  </script>
