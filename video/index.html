<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#f2f2f2"},
    {"id":"color-ink","type":"color","label":"Text","default":"#111111"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#fe7a19"},
    {"id":"color-dark","type":"color","label":"Dark world","default":"#0c0c0e"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Radar launch film</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #f2f2f2;
        --color-ink: #111111;
        --color-accent: #fe7a19;
        --color-dark: #0c0c0e;
        --ink-2: #6e6e73;
        --card: #fafafa;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        font-family: var(--font-display);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="43.6"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
    >
      <!-- Scenes -->
      <div id="hook" class="scene clip" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tabs" class="scene clip" data-composition-id="tabs" data-composition-src="compositions/tabs.html"
        data-start="4.2" data-duration="3.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reveal" class="scene clip" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="8" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="ask" class="scene clip" data-composition-id="ask" data-composition-src="compositions/ask.html"
        data-start="12.4" data-duration="7.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="latest" class="scene clip" data-composition-id="latest" data-composition-src="compositions/latest.html"
        data-start="20" data-duration="5.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="directory" class="scene clip" data-composition-id="directory" data-composition-src="compositions/directory.html"
        data-start="25.8" data-duration="4.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="phones" class="scene clip" data-composition-id="phones" data-composition-src="compositions/phones.html"
        data-start="30.7" data-duration="4.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="claim" class="scene clip" data-composition-id="claim" data-composition-src="compositions/claim.html"
        data-start="35.6" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" class="scene clip" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="38" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>


      <!-- Music: "Polished Hit", 120 BPM. Starts 0.5 s in so the groove enters as the tabs
           collapse into the radar dot (7.75 s) and the drop lands on "More building." (36.5 s). -->
      <audio id="music" class="clip" src="assets/music/polished-hit.mp3" data-start="0" data-duration="43.6" data-media-start="0.5" data-track-index="2" data-volume="0.88"></audio>

      <!-- Sound: each clip starts so its peak lands one frame after the picture -->
      <audio id="sfx-whip-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.84" data-duration="0.57" data-track-index="3" data-volume="0.7"></audio>
      <audio id="sfx-tabs" class="clip" src="assets/sfx/typing.mp3" data-start="4.3" data-duration="1.54" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-tabs-2" class="clip" src="assets/sfx/typing.mp3" data-start="5.85" data-duration="1.54" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-collapse" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.42" data-duration="0.57" data-track-index="3" data-volume="0.55"></audio>
      <audio id="sfx-dot" class="clip" src="assets/sfx/pop.mp3" data-start="7.95" data-duration="0.72" data-track-index="5" data-volume="0.6"></audio>
      <audio id="sfx-blips" class="clip" src="assets/sfx/sparkle.mp3" data-start="8.6" data-duration="1.8" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="9.55" data-duration="3.4" data-track-index="3" data-volume="0.55" data-fade-out="0.6"></audio>
      <audio id="sfx-type-1" class="clip" src="assets/sfx/typing.mp3" data-start="13.05" data-duration="1.54" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-type-2" class="clip" src="assets/sfx/typing.mp3" data-start="13.85" data-duration="1.3" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-ask-click" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.46" data-duration="0.37" data-track-index="6" data-volume="0.9"></audio>
      <audio id="sfx-panel" class="clip" src="assets/sfx/pop.mp3" data-start="15.55" data-duration="0.72" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-dark" class="clip" src="assets/sfx/whoosh.mp3" data-start="19.48" data-duration="0.57" data-track-index="3" data-volume="0.6"></audio>
      <audio id="sfx-rise" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="22.6" data-duration="0.57" data-track-index="3" data-volume="0.45"></audio>
      <audio id="sfx-light" class="clip" src="assets/sfx/whoosh.mp3" data-start="25.48" data-duration="0.57" data-track-index="3" data-volume="0.6"></audio>
      <audio id="sfx-card-click" class="clip" src="assets/sfx/click-soft.mp3" data-start="30.11" data-duration="0.37" data-track-index="6" data-volume="0.9"></audio>
      <audio id="sfx-card-zoom" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="30.35" data-duration="0.57" data-track-index="3" data-volume="0.55"></audio>
      <audio id="sfx-phones" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="30.85" data-duration="2.1" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sfx-flood" class="clip" src="assets/sfx/whoosh.mp3" data-start="35.32" data-duration="0.57" data-track-index="3" data-volume="0.6"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="38.5" data-duration="2.1" data-track-index="5" data-volume="0.8"></audio>
      <audio id="sfx-url-click" class="clip" src="assets/sfx/click-soft.mp3" data-start="40.56" data-duration="0.37" data-track-index="6" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
