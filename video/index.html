<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-accent","type":"color","label":"Accent / glow","default":"#fe7a19"},
    {"id":"color-night","type":"color","label":"Night ground","default":"#0b0807"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Radar launch film</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-accent: #fe7a19;
        --color-night: #0b0807;
        --cream: #f6f1ea;
        --mute: rgba(246, 241, 234, 0.55);
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--color-night); font-family: var(--font-display);
        -webkit-font-smoothing: antialiased;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-night); }
      .scene { position: absolute; inset: 0; }

      /* Shared looks, in the reference films' grammar */
      .stage { position: absolute; inset: 0; overflow: hidden; }
      .night {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 1300px 760px at 50% 118%, rgba(254, 122, 25, 0.62) 0%, rgba(254, 122, 25, 0.18) 45%, rgba(254, 122, 25, 0) 72%),
          radial-gradient(ellipse 900px 520px at 12% -12%, rgba(255, 176, 103, 0.16) 0%, rgba(255, 176, 103, 0) 70%),
          var(--color-night);
      }
      .line {
        position: absolute; left: 0; right: 0; text-align: center;
        font-size: 92px; font-weight: 400; letter-spacing: -0.035em; line-height: 1.05;
        color: var(--cream); white-space: nowrap;
      }
      .line.ink { color: #1b1714; }
      .line .w { display: inline-block; opacity: 0; margin: 0 0.12em; }
      .grad {
        background: linear-gradient(100deg, #ffd2a6 0%, #fe7a19 55%, #ff5a1f 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .glass {
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 255, 255, 0.24);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      }
      .photo { position: absolute; left: 0; top: 0; width: 2000px; height: 1116px; transform-origin: 0 0; transform: translateX(-7.7px) scale(0.96774); }
      .photo > img.bgimg { position: absolute; left: 0; top: 0; width: 2000px; height: 1116px; }
      .screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
      .screen img { display: block; width: 100%; height: 100%; }
      .cursor { position: absolute; left: 0; top: 0; width: 60px; height: 60px; z-index: 20; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44" data-width="1920" data-height="1080" data-motion-blur="on">
      <!-- Scenes overlap by 0.5 s: each one dissolves in through a blur over the last. -->
      <div id="hook" class="scene clip" style="z-index:1" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="search" class="scene clip" style="z-index:2" data-composition-id="search" data-composition-src="compositions/search.html" data-start="3.9" data-duration="4.3" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="bloom" class="scene clip" style="z-index:3" data-composition-id="bloom" data-composition-src="compositions/bloom.html" data-start="7.7" data-duration="4.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="ask" class="scene clip" style="z-index:4" data-composition-id="ask" data-composition-src="compositions/ask.html" data-start="11.3" data-duration="6.3" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="pocket" class="scene clip" style="z-index:5" data-composition-id="pocket" data-composition-src="compositions/pocket.html" data-start="17.1" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="latest" class="scene clip" style="z-index:6" data-composition-id="latest" data-composition-src="compositions/latest.html" data-start="19.7" data-duration="5.3" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="grid" class="scene clip" style="z-index:7" data-composition-id="grid" data-composition-src="compositions/grid.html" data-start="24.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="fewer" class="scene clip" style="z-index:8" data-composition-id="fewer" data-composition-src="compositions/fewer.html" data-start="29.5" data-duration="6.1" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="claim" class="scene clip" style="z-index:9" data-composition-id="claim" data-composition-src="compositions/claim.html" data-start="35.1" data-duration="3.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" class="scene clip" style="z-index:10" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="38.3" data-duration="5.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music: "Polished Hit", 120 BPM, from 0.5 s in: the groove enters on the bloom (7.75 s),
           the drop lands on "More building." (36.5 s). -->
      <audio id="music" class="clip" src="assets/music/polished-hit.mp3" data-start="0" data-duration="44" data-media-start="0.5" data-track-index="3" data-volume="0.88"></audio>

      <!-- Effects: few and soft, each on a visible action (peak one frame after the picture). -->
      <audio id="sfx-rise" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="5.25" data-duration="3.2" data-track-index="4" data-volume="0.45" data-fade-out="0.5"></audio>
      <audio id="sfx-petals" class="clip" src="assets/sfx/sparkle.mp3" data-start="8.0" data-duration="1.8" data-track-index="5" data-volume="0.25"></audio>
      <audio id="sfx-type-1" class="clip" src="assets/sfx/typing.mp3" data-start="12.15" data-duration="1.54" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-type-2" class="clip" src="assets/sfx/typing.mp3" data-start="13.0" data-duration="1.3" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sfx-send" class="clip" src="assets/sfx/click-soft.mp3" data-start="14.46" data-duration="0.37" data-track-index="7" data-volume="0.85"></audio>
      <audio id="sfx-cards" class="clip" src="assets/sfx/pop.mp3" data-start="14.75" data-duration="0.72" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="16.97" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh.mp3" data-start="19.57" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="22.6" data-duration="0.57" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-w4" class="clip" src="assets/sfx/whoosh.mp3" data-start="24.37" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-w5" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="29.37" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="38.75" data-duration="2.1" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-url" class="clip" src="assets/sfx/click-soft.mp3" data-start="40.86" data-duration="0.37" data-track-index="7" data-volume="0.85"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
